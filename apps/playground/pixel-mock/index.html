<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BomaSafety — Crime Elimination &amp; Sentry Intelligence Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { margin: 0; background: #0b0f17; color: #c9d1d9; display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
    aside { padding: 16px; border-right: 1px solid #1f2937; overflow-y: auto; background: #111827; }
    main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
    h1 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; color: #60a5fa; }
    label { display: block; font-size: 11px; margin: 8px 0 2px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; box-sizing: border-box; background: #1f2937; color: #f3f4f6; border: 1px solid #374151; border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 12px; }
    button { margin-top: 12px; width: 100%; padding: 9px; border-radius: 6px; border: 1px solid #374151; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button.stop { background: #dc2626; }
    button.stop:hover { background: #b91c1c; }
    #face { border-radius: 50%; box-shadow: 0 0 50px rgba(37,99,235,.25); background: #000; }
    #hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; font-size: 12px; text-align: center; width: 100%; max-width: 600px; background: #111827; padding: 12px; border-radius: 8px; border: 1px solid #1f2937; }
    #hud .v { font-size: 20px; font-weight: 700; color: #60a5fa; }
    #hud .v.bad { color: #ef4444; }
    #forensics { width: 100%; max-width: 600px; background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 12px 16px; box-sizing: border-box; }
    .threat-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; background: #374151; color: #fff; }
    .threat-CLEAR { background: #059669; color: #ecfdf5; }
    .threat-SUSPICIOUS { background: #d97706; color: #fffbeb; }
    .threat-HOTLIST_MATCH, .threat-EMERGENCY { background: #dc2626; color: #fef2f2; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    #log { font-size: 10px; white-space: pre-wrap; color: #9ca3af; margin-top: 12px; max-height: 25vh; overflow-y: auto; background: #0b0f17; padding: 8px; border-radius: 6px; border: 1px solid #1f2937; }
    #cam { width: 100%; border-radius: 6px; border: 1px solid #374151; margin-top: 8px; }
    .status { font-size: 12px; margin-top: 10px; display: flex; align-items: center; }
    .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; }
    .status.on .dot { background: #10b981; }
    .whatsapp-preview { margin-top: 12px; padding: 10px; background: #064e3b; border: 1px solid #059669; border-radius: 6px; font-size: 11px; color: #d1fae5; line-height: 1.4; }
  </style>
</head>
<body>
  <aside>
    <h1>🛡️ BomaSafety Sentry Mock</h1>
    <label>Cloud Brain URL</label>
    <input id="url" value="ws://localhost:8080" />
    <label>Sentry Unit ID</label>
    <input id="device" value="sentry-nairobi-001" />
    <label>Bearer Token</label>
    <input id="token" value="local-secret" />
    <button id="connect">Activate Sentry &amp; Stream</button>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">offline</span></div>
    <video id="cam" muted playsinline></video>
    <div class="whatsapp-preview" id="whatsappBox">
      <b>💬 WhatsApp Security Mesh:</b><br />
      <span id="whatsappMsg">Awaiting incident broadcast...</span>
    </div>
    <div id="log"></div>
  </aside>
  <main>
    <canvas id="face" width="300" height="300"></canvas>
    <div id="forensics">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-weight:600; font-size:13px;">TRANSIT FORENSIC RADAR</span>
        <span class="threat-badge threat-CLEAR" id="threatBadge">CLEAR</span>
      </div>
      <div style="font-size:12px; color:#9ca3af;" id="forensicDetails">
        Plate: <b id="fpPlate" style="color:#f3f4f6;">--</b> &middot;
        Type: <b id="fpType" style="color:#f3f4f6;">--</b> &middot;
        Traits: <span id="fpTraits">Awaiting camera trigger</span>
      </div>
    </div>
    <div id="hud">
      <div>Turn Latency<br /><span class="v" id="rtt">–</span> ms</div>
      <div>p50 Median<br /><span class="v" id="rttMed">–</span> ms</div>
      <div>Security Turns<br /><span class="v" id="turns">0</span></div>
      <div>Frames Ingested<br /><span class="v" id="jpegs">0</span></div>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
